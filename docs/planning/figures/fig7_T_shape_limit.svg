  .small { font-family: sans-serif; font-size: calc(var(--text) * 0.7); fill: #444444; }
  .arrow { fill: #1b6ca8; }
  .reverse { fill: none; stroke: #d97706; stroke-width: var(--line-medium); stroke-dasharray: var(--dash); }
  .arrow-reverse { fill: #d97706; }
</style>
