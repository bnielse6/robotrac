; ESP32 firmware for the roofing robot. Build with PlatformIO (VS Code extension or `pip install platformio`).
;
;   pio run                         build the simulated-hardware firmware
;   pio run -t upload               flash it
;   pio device monitor              NOT useful: the serial port carries protocol lines, not text logs
;
; See docs/software/firmware_guide.md.

[env:esp32dev]
; Simulated hardware (src/hal_sim.cpp). Talks the real protocol, fakes the sensors and motors.
; Use this first, with nothing wired up.
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
build_flags =
    -DUSE_SIM_HAL=1

[env:esp32dev_real]
; Real hardware (src/hal_esp32.cpp). Every function there is a TODO until you fill in the pins and drivers.
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
build_flags =
    -DUSE_SIM_HAL=0
